name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  # Opt into Node.js 24 for GitHub Actions (Node 20 is deprecated)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Make Maven wrapper executable (non-Windows)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Build with Maven (Windows)
        if: runner.os == 'Windows'
        run: ./mvnw.cmd clean verify -B -DgenerateExe=false
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

      - name: Build with Maven (Linux/macOS)
        if: runner.os != 'Windows'
        run: JAVA_TOOL_OPTIONS="-Djava.awt.headless=false" ./mvnw clean verify -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-jar-${{ matrix.os }}
          path: target/jmkvpropedit-*.jar

      - name: Upload EXE artifact (Windows)
        if: runner.os == 'Windows' && hashFiles('JMkvpropedit.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-exe
          path: JMkvpropedit.exe

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start virtual display (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run quality checks
        run: JAVA_TOOL_OPTIONS="-Djava.awt.headless=false" ./mvnw clean verify -Pquality -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, quality]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CODESIGN_STOREPASS: ${{ secrets.CODESIGN_STOREPASS }}
      CODESIGN_KEYPASS: ${{ secrets.CODESIGN_KEYPASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Decode keystore
        if: ${{ secrets.CODESIGN_JKS_B64 != '' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          [System.IO.File]::WriteAllBytes("build/codesign.jks", [Convert]::FromBase64String("${{ secrets.CODESIGN_JKS_B64 }}"))

      - name: Build JAR
        run: ./mvnw.cmd clean package -B -DgenerateExe=false -DskipTests

      - name: Build EXE (debug)
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $root = (Get-Location).Path
          $jarPath = Get-ChildItem -Path (Join-Path $root "target") -Filter "jmkvpropedit-*.jar" | Select-Object -First 1 | ForEach-Object { $_.FullName }
          $exePath = Join-Path $root "JMkvpropedit.exe"
          $icoPath = Join-Path $root "launch4j/config/java.ico"
          Write-Host "JAR path: $jarPath"
          if (Test-Path $jarPath) {
            Write-Host "JAR exists: $((Get-Item $jarPath).Length) bytes"
          } else {
            Write-Host "JAR NOT FOUND at $jarPath"
            Get-ChildItem -Path (Join-Path $root "target") -Name
            exit 0
          }
          # Create a temp config with absolute paths
          $configPath = Join-Path $root "launch4j-exe.xml"
          @"
          <launch4jConfig>
            <dontWrapJar>false</dontWrapJar>
            <headerType>gui</headerType>
            <jar>$jarPath</jar>
            <outfile>$exePath</outfile>
            <errTitle></errTitle>
            <cmdLine></cmdLine>
            <chdir></chdir>
            <priority>normal</priority>
            <downloadUrl>https://adoptium.net</downloadUrl>
            <supportUrl></supportUrl>
            <customProcName>false</customProcName>
            <stayAlive>false</stayAlive>
            <manifest></manifest>
            <icon>$icoPath</icon>
            <jre>
              <path>%JAVA_HOME%;%PATH%</path>
              <minVersion>21</minVersion>
              <maxVersion></maxVersion>
            </jre>
          </launch4jConfig>
          "@ | Set-Content -Path $configPath -Encoding ASCII
          Write-Host "Running Launch4j..."
          java -jar launch4j/launch4j.jar $configPath 2>&1
          Write-Host "Launch4j exit code: $LASTEXITCODE"
          Remove-Item $configPath -Force -ErrorAction SilentlyContinue
          if (Test-Path $exePath) {
            Write-Host "EXE created: $((Get-Item $exePath).Length) bytes"
            if (Test-Path "build/codesign.jks") {
              Write-Host "Signing EXE with sign4j and jsign..."
              $sign4j = Join-Path $root "launch4j/sign4j/sign4j.exe"
              $jsign = Join-Path $root "launch4j/sign4j/jsign-2.0.jar"
              $keystore = Join-Path $root "build/codesign.jks"
              & $sign4j java -jar $jsign --keystore $keystore --alias codesign --storepass "$env:CODESIGN_STOREPASS" --keypass "$env:CODESIGN_KEYPASS" $exePath
              Write-Host "Signing exit code: $LASTEXITCODE"
            } else {
              Write-Host "No keystore found, skipping signing."
            }
          } else {
            Write-Host "EXE NOT FOUND"
          }
          exit 0

      - name: Ensure JAR exists for release
        run: |
          $jar = Get-ChildItem 'target/jmkvpropedit-*.jar' | Select-Object -First 1
          if (-not $jar) { throw 'JAR not found' }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/jmkvpropedit-*.jar
            JMkvpropedit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
