name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  # Opt into Node.js 24 for GitHub Actions (Node 20 is deprecated)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Make Maven wrapper executable (non-Windows)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Build with Maven (Windows)
        if: runner.os == 'Windows'
        run: ./mvnw.cmd clean verify -B -DgenerateExe=false
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

      - name: Build with Maven (Linux/macOS)
        if: runner.os != 'Windows'
        run: JAVA_TOOL_OPTIONS="-Djava.awt.headless=false" ./mvnw clean verify -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-jar-${{ matrix.os }}
          path: target/jmkvpropedit-*.jar

      - name: Upload EXE artifact (Windows)
        if: runner.os == 'Windows' && hashFiles('JMkvpropedit.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-exe
          path: JMkvpropedit.exe

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start virtual display (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run quality checks
        run: JAVA_TOOL_OPTIONS="-Djava.awt.headless=false" ./mvnw clean verify -Pquality -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, quality]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: ./mvnw.cmd clean package -B -DgenerateExe=false -DskipTests

      - name: Build EXE (debug)
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Building EXE..."
          java -jar launch4j/launch4j.jar launch4j/config/exe-standalone.xml 2>&1
          $exitCode = $LASTEXITCODE
          Write-Host "Launch4j exit code: $exitCode"
          if (Test-Path 'JMkvpropedit.exe') {
            Write-Host "EXE created: $(Get-Item 'JMkvpropedit.exe').Length bytes"
          } else {
            Write-Host "EXE NOT FOUND"
          }
          exit 0

      - name: Ensure JAR exists for release
        run: if (-not (Test-Path 'target/jmkvpropedit-2.5.0.jar')) { throw 'JAR not found' }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/jmkvpropedit-2.5.0.jar
            JMkvpropedit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
