name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

env:
  # Code-signing passwords are read from repository secrets.
  # Configure them in Settings > Secrets and variables > Actions:
  #   CODESIGN_STOREPASS  – keystore password
  #   CODESIGN_KEYPASS    – key password
  #   CODESIGN_JKS_B64    – base64-encoded keystore file content
  CODESIGN_STOREPASS: ${{ secrets.CODESIGN_STOREPASS }}
  CODESIGN_KEYPASS: ${{ secrets.CODESIGN_KEYPASS }}
  # Opt into Node.js 24 for GitHub Actions (Node 20 is deprecated)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Make Maven wrapper executable (non-Windows)
        if: runner.os != 'Windows'
        run: chmod +x mvnw

      - name: Build with Maven (Windows)
        if: runner.os == 'Windows'
        run: ./mvnw.cmd clean verify -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

      - name: Build with Maven (Linux/macOS)
        if: runner.os != 'Windows'
        run: JAVA_TOOL_OPTIONS="-Djava.awt.headless=false" ./mvnw clean verify -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-jar-${{ matrix.os }}
          path: target/jmkvpropedit-*.jar

      - name: Upload EXE artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: jmkvpropedit-exe
          path: JMkvpropedit.exe

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start virtual display (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run quality checks
        run: JAVA_TOOL_OPTIONS="-Djava.awt.headless=false" ./mvnw clean verify -Pquality -B
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=false"
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, quality]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build release artifacts
        run: ./mvnw.cmd clean package -B

      - name: Decode keystore
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          [Convert]::FromBase64String("${{ secrets.CODESIGN_JKS_B64 }}") | Set-Content -NoNewline -Path build/codesign.jks -AsByteStream

      - name: Install Windows SDK (signtool)
        shell: pwsh
        run: |
          choco install windows-sdk-10-version-2104-all -y --no-progress

      - name: Convert JKS to PFX for signtool
        shell: pwsh
        run: |
          keytool -importkeystore `
            -srckeystore build/codesign.jks -destkeystore build/codesign.pfx `
            -srcstoretype JKS -deststoretype PKCS12 `
            -srcstorepass "$env:CODESIGN_STOREPASS" -deststorepass "$env:CODESIGN_STOREPASS" `
            -srcalias codesign -destalias codesign `
            -srckeypass "$env:CODESIGN_KEYPASS" -destkeypass "$env:CODESIGN_STOREPASS" `
            -noprompt

      - name: Sign EXE with signtool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "x64" -Directory -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName "signtool.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files\Windows Kits\10\bin" -Filter "x64" -Directory -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName "signtool.exe" } | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $signtool) {
            Write-Error "signtool.exe (x64) not found after installing Windows SDK."
            exit 1
          }
          Write-Host "Using signtool: $signtool"
          & $signtool sign `
            /f build/codesign.pfx `
            /p "$env:CODESIGN_STOREPASS" `
            /tr http://timestamp.digicert.com `
            /td sha256 /fd sha256 `
            /a `
            JMkvpropedit.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            JMkvpropedit.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
